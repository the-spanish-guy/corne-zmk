# Configurações só do lado ESQUERDO (central).
# Tudo o que é comum às duas metades (display, RGB, bateria, sleep, BLE) fica em
# config/corne.conf.

# ZMK Studio: só no lado central. Precisa do snippet studio-rpc-usb-uart no build.yaml
# para funcionar por USB.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
