# Intervalo de tempo para relatório de bateria em segundos
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Configurações de debounce do teclado
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Potência de transmissão do BLE: 0 dBm (padrão do Zephyr) para economizar bateria.
# Se a conexão ficar instável, subir para +4 (CONFIG_BT_CTLR_TX_PWR_PLUS_4=y)
# ou +8 (CONFIG_BT_CTLR_TX_PWR_PLUS_8=y).
CONFIG_BT_CTLR_TX_PWR_0=y

# Nome do teclado no Bluetooth
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Desativa a exigência de inscrição GATT (resolve problemas no Windows)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Configurações do Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Apaga o display quando o teclado fica ocioso (o nice_oled deixa isso em 'n' por padrão)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Pilha da thread do display. O módulo nice_oled pede 4096, mas o ZMK aplica 3072,
# e o LVGL 9 estoura essa pilha e trava o teclado ~2 s após ligar. 8192 foi testado e funciona.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# Widgets disponíveis (mantidos para referência)
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
#CONFIG_ZMK_WIDGET_LAYER_STATUS=n
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
#CONFIG_ZMK_WIDGET_BONGO_CAT=y

# Usa a tela de status do módulo nice_oled (em vez da tela padrão do ZMK)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ---------------------------------------------------------------------------
# Animações do OLED (módulo tokyo2006/zmk-nice-oled)
# Todas comentadas: descomente a que quiser usar.
# Padrão do módulo no lado periférico: gato (ANIMATION_PERIPHERAL_CAT=y).
# Ao ativar outra animação periférica, desative o gato com ..._CAT=n.
# ---------------------------------------------------------------------------

# --- Lado periférico (direito): animação vertical ---
# Habilita a animação no periférico (padrão: y)
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
# Animação: gato (padrão: y)
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
# Animação: gema
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# Animação: cabeça
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
# Animação: pokemon
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
# Animação: astronauta (spaceman)
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
# Animação: bateria inteligente (smart battery)
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y
# Duração da animação em milissegundos (o padrão varia por animação)
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1000
# Widget de WPM no periférico
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=y

# --- Lado periférico: imagem estática (usada quando não há animação) ---
# Habilita a imagem estática (padrão: y se não houver animação)
#CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
# Imagem estática: vim
#CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y
# Imagem estática: vim_marcos
#CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIP_MARCOS=y

# --- Lado central (esquerdo): WPM ---
# Widget de WPM (padrão: y)
#CONFIG_NICE_OLED_WIDGET_WPM=y
# Animação: Luna, o cachorro (neste build vem desligada; para usar, desligue o Bongo Cat)
#CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
# Velocidade da Luna em ms (padrão: 300)
#CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300
# Animação: Bongo Cat, o gato batucando (neste build vem LIGADO e é o que aparece
# no lado esquerdo; só anima enquanto você digita)
#CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
# Velocidade do Bongo Cat em ms (padrão: 300)
#CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT_ANIMATION_MS=300
# Bongo Cat responsivo: reage às teclas (aumenta stack da thread para 4096 e prioridade para 3)
#CONFIG_NICE_OLED_WIDGET_RESPONSIVE=y
#CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=y

# --- Indicadores HID (CapsLock etc.) com animação ---
# Luna ao ativar o CapsLock
#CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
#CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ANIMATION_MS=300
# Bongo Cat ao ativar o CapsLock
#CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=y
#CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT_ANIMATION_MS=300

# --- Indicadores de modificadores (Shift, Ctrl etc.) com animação ---
# Luna reagindo aos modificadores
#CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=y
#CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA_ANIMATION_MS=300
# Bongo Cat reagindo aos modificadores
#CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=y
#CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT_ANIMATION_MS=300

# --- Arte de sleep (tela exibida quando o teclado fica ocioso/dorme) ---
# Mostrar a arte ao entrar em idle
#CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
# Mostrar a arte ao entrar em deep sleep
#CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y
# Mostrar a imagem de bootloader brevemente ao acordar
#CONFIG_NICE_OLED_SLEEP_STATUS_BOOTLOADER=y

# Configurações de Energia e Sleep
# Tempo de inatividade antes do modo idle (2 minutos). No idle o display apaga e o RGB
# desliga (AUTO_OFF_IDLE); voltam quando você digita de novo. Cada metade conta a
# própria atividade.
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Habilita suporte a deep sleep
CONFIG_ZMK_SLEEP=y

# Tempo de inatividade antes do deep sleep (30 minutos). Precisa ser maior que o idle.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ZMK Studio: configurado só no lado esquerdo (central), em
# boards/shields/corne/corne_left.conf

# Configurações RGB
CONFIG_ZMK_RGB_UNDERGLOW=y

# Desliga RGB quando inativo para economia de bateria
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Configurações iniciais do RGB
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
