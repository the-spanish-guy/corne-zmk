# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # Display OLED com a tela padrão do ZMK (o módulo nice_oled travava o teclado,
  # então ele não é mais usado). O ZMK Studio fica só no lado esquerdo (central).
  - board: nice_nano//zmk
    shield: corne_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset

  # Desativado: o módulo nice_oled travava o teclado ~2 s após ligar.
  # - board: nice_nano//zmk
  #   shield: corne_left nice_oled
  #   snippet: studio-rpc-usb-uart
  # - board: nice_nano//zmk
  #   shield: corne_right nice_oled
  # Desativado: nice!view (display sem uso no momento).
  # - board: nice_nano//zmk
  #   shield: corne_left nice_view_adapter nice_view_gem
  #   snippet: studio-rpc-usb-uart
  # - board: nice_nano//zmk
  #   shield: corne_right nice_view_adapter nice_view_gem
