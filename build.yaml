# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # ---------------------------------------------------------------------
  # BISSECÇÃO (temporária).
  # Resultados até aqui:
  #   - mínimo (sem display/Studio/RGB):  FUNCIONA
  #   - + ZMK Studio (L-studio + R-min):  FUNCIONA
  #   - + display nice_oled (L/R-oled):   TRAVA ~2 s após ligar
  # Teste 3: display com a tela PADRÃO do ZMK (sem o módulo nice_oled).
  #   Gravar L-builtin no esquerdo e R-builtin no direito.
  # ---------------------------------------------------------------------
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_DISPLAY=y -DCONFIG_I2C=y -DCONFIG_SSD1306=y
    artifact-name: L-builtin
  - board: nice_nano//zmk
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=y -DCONFIG_I2C=y -DCONFIG_SSD1306=y
    artifact-name: R-builtin

  - board: nice_nano//zmk
    shield: settings_reset

  # Entradas anteriores / originais (restaurar depois):
  # - board: nice_nano//zmk
  #   shield: corne_left nice_oled
  #   snippet: studio-rpc-usb-uart
  # - board: nice_nano//zmk
  #   shield: corne_right nice_oled
  # - board: nice_nano//zmk
  #   shield: corne_left nice_view_adapter nice_view_gem
  #   snippet: studio-rpc-usb-uart
  # - board: nice_nano//zmk
  #   shield: corne_right nice_view_adapter nice_view_gem
