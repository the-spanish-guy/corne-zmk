# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # TESTE MÍNIMO (temporário): só corne_left / corne_right, sem display, sem Studio, sem RGB.
  # As entradas originais (nice_oled e nice_view_gem) estão logo abaixo, comentadas.
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset

  # - board: nice_nano//zmk
  #   shield: corne_left nice_oled
