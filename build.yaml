# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # ---------------------------------------------------------------------
  # BRANCH nice-oled-fix: tentar fazer o módulo nice_oled funcionar.
  # Baseline conhecido: nice_oled (animações ligadas) TRAVA ~2 s após ligar.
  # Hipótese: a pilha da thread do display ficou em 3072 (o módulo pede 4096 mas
  # o valor não é aplicado) e o LVGL 9 estoura a pilha; o pool do LVGL (4096/8192)
  # também pode ser pouco.
  # Variantes (gravar o par L-x + R-x e ver se trava):
  #   L/R-stack : pilha do display = 8192
  #   L/R-pool  : pool do LVGL     = 16384
  #   L/R-both  : os dois
  # ---------------------------------------------------------------------
  - board: nice_nano//zmk
    shield: corne_left nice_oled
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
    artifact-name: L-stack
  - board: nice_nano//zmk
    shield: corne_right nice_oled
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
    artifact-name: R-stack

  - board: nice_nano//zmk
    shield: corne_left nice_oled
    cmake-args: -DCONFIG_LV_Z_MEM_POOL_SIZE=16384
    artifact-name: L-pool
  - board: nice_nano//zmk
    shield: corne_right nice_oled
    cmake-args: -DCONFIG_LV_Z_MEM_POOL_SIZE=16384
    artifact-name: R-pool

  - board: nice_nano//zmk
    shield: corne_left nice_oled
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192 -DCONFIG_LV_Z_MEM_POOL_SIZE=16384
    artifact-name: L-both
  - board: nice_nano//zmk
    shield: corne_right nice_oled
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192 -DCONFIG_LV_Z_MEM_POOL_SIZE=16384
    artifact-name: R-both

  - board: nice_nano//zmk
    shield: settings_reset
