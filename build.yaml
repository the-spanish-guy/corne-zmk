# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # ---------------------------------------------------------------------
  # BISSECÇÃO (temporária). O firmware mínimo (sem display/Studio/RGB) funciona.
  # Teste 1 (Studio):  gravar  L-studio  no esquerdo + R-min  no direito.
  # Teste 2 (display): gravar  L-oled    no esquerdo + R-oled no direito.
  # ---------------------------------------------------------------------

  # Direito mínimo (sem display, sem Studio, sem RGB)
  - board: nice_nano//zmk
    shield: corne_right
    artifact-name: R-min

  # Esquerdo + ZMK Studio (sem display)
  - board: nice_nano//zmk
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
    artifact-name: L-studio

  # Esquerdo e direito + display nice_oled (sem Studio)
  - board: nice_nano//zmk
    shield: corne_left nice_oled
    artifact-name: L-oled
  - board: nice_nano//zmk
    shield: corne_right nice_oled
    artifact-name: R-oled

  - board: nice_nano//zmk
    shield: settings_reset

  # Entradas originais (restaurar depois):
  # - board: nice_nano//zmk
  #   shield: corne_left nice_oled
  #   snippet: studio-rpc-usb-uart
  # - board: nice_nano//zmk
  #   shield: corne_right nice_oled
  # - board: nice_nano//zmk
  #   shield: corne_left nice_view_adapter nice_view_gem
  #   snippet: studio-rpc-usb-uart
  # - board: nice_nano//zmk
  #   shield: corne_right nice_view_adapter nice_view_gem
